[project]
name = "icinga-mcp"
version = "0.3.0rc1"
description = "MCP servers for Icinga2 and Icinga Director"
requires-python = ">=3.10"
license = "MIT AND Unlicense"
license-files = ["LICENSE", "src/icinga2_mcp/plugin_catalog/LICENSE", "src/icinga2_mcp/plugin_catalog/COPYRIGHT"]
dependencies = [
    "mcp>=1.30,<2",
    "requests>=2.31.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.14.2",
    "starlette>=1.3.1,<2",
    "uvicorn>=0.31.1,<1",
]

[project.scripts]
icinga2-mcp = "icinga2_mcp.server:main"
director-mcp = "director_mcp.server:main"

[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
"icinga2_mcp.plugin_catalog" = ["LICENSE", "COPYRIGHT"]

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Test and build (Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install project
        run: python -m pip install -e .
      - name: Check dependencies
        run: python -m pip check
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Validate licenses and audit resolved dependencies
        if: matrix.python-version == '3.14'
        run: |
          python -m venv "${RUNNER_TEMP}/dependency-audit"
          "${RUNNER_TEMP}/dependency-audit/bin/python" -m pip install "pip-audit==2.10.1" "reuse==6.3.0"
          "${RUNNER_TEMP}/dependency-audit/bin/reuse" lint
          site_packages=$(python -c 'import sysconfig; print(sysconfig.get_path("purelib"))')
          "${RUNNER_TEMP}/dependency-audit/bin/python" -m pip_audit --skip-editable --path "$site_packages"
      - name: Build wheel
        run: python -m pip wheel --no-deps --wheel-dir dist .

name: CodeQL

on:
  push:
    branches: [main]
    paths:
      - "**/*.py"
      - pyproject.toml
      - .github/workflows/codeql.yml
  pull_request:
    branches: [main]
    paths:
      - "**/*.py"
      - pyproject.toml
      - .github/workflows/codeql.yml
  schedule:
    - cron: "23 5 * * 2"

permissions:
  contents: read
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze Python
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          languages: python
          build-mode: none
      - uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
